services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: Employee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manoj
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: springapp
    ports:
      - "8082:8092"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker